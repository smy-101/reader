# CI(D-23):backend job 跑集成测试;web job 跑全栈 E2E(Playwright × 真实后端 × Docker PG);无 CD。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21(Temurin,与 mise 本地一致)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests (mvn test)
        working-directory: backend
        run: mvn --batch-mode test

  # M1-03:apps/web 全栈 E2E(Seam B)。编排见 apps/web/e2e/global-setup.ts:
  # global-setup 内 mvn package 打后端 jar,起 pgvector/pgvector:pg18 容器与真实后端进程;
  # Playwright webServer 起 Vite 代理 /api。Docker 为 GitHub runner 自带。
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24(与 mise 本地一致)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up JDK 21(后端打包用)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium(含系统依赖)
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright 全栈)
        working-directory: apps/web
        run: npx playwright test

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # M2-03: Tauri 桌面壳云打包(ADR-0006)——windows runner 出 NSIS 安装包并上传 artifact。
  # 触发口径:push 到 main / 手动(ADR-0006 记档取舍:PR 不打包,测试反馈轻);
  # 与 backend/web job 互不干扰(Playwright E2E 留在 ubuntu)。
  # 本机零 Rust/MSVC 工具链(D-22 桌面版):WSL 无法原生产出 Windows 安装包。
  desktop-package:
    # ADR-0006:触发取 push 到 main + 手动,PR 不打包(workflow 级 on.pull_request 对全部 job 生效,这里显式跳过)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        # windows runner 自带 Git bash;与本地/另两个 job 的 bash 语义完全一致,规避 pwsh 传参差异
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24(与 mise 本地一致)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Rust(stable MSVC;windows runner 自带 VS 与 WebView2)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build web(不注入构建期 token,桌面端 token 一律经连接设置运行时配置,不进壳二进制)
        working-directory: apps/web
        run: |
          npm run build
          # 守卫:构建产物缺失就在此步大声失败(与 tauri 的 frontendDist 报错区分开)
          node -e "const fs=require('fs');if(!fs.existsSync('dist/index.html')){console.error('MISSING: apps/web/dist/index.html');process.exit(1)};console.log('OK: dist/index.html present')"
        env:
          VITE_READER_TOKEN: ""

      - name: Tauri build(NSIS)
        working-directory: apps/desktop
        run: npx tauri build

      - name: Upload NSIS 安装包 artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error
