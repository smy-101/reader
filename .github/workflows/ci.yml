# CI(D-23):仅跑后端测试(Testcontainers 需要 Docker,GitHub runner 自带);无 CD。
# apps/* 各自落地后再加 job。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21(Temurin,与 mise 本地一致)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Backend tests (mvn test)
        working-directory: backend
        run: mvn --batch-mode test
